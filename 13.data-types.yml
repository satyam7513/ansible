---
- name: ansible datatypes
  hosts: local
  connection: local
  vars:
    DURATION: 120
    COURSE: Devsecops with aws
    IS_LIVE: true
    TOOLS:
      - Linux
      - shell
      - Ansible
    CONCEPTS:
      CI: Jenkins
      SCRIPTING: Shell, Ansible, Terraform, Python
      tasks:
        - name: print course information
          ansible.builtin.debug:
            msg: "Course is: {{ COURSE }}, Duration: {{ DURATION }}, is live?: {{ IS_LIVE
              }}, Tools are: {{ TOOLS }}, Concepts are: {{ CONCETPS }}"
