---
- name: install packages
  hosts: frontend
  become: yes
  tasks: 
  - name: isntall packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: "{{ item }}"

    loop:
    - { name: 'nginx', state: 'present' }
    - { name: 'mysql', state: 'absent' }
    - { name: 'zip', state: 'absent' }
    